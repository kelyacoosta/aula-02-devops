name: CI
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Checar arquivos estáticos
        run: |
          ls -R
          echo "Arquivos HTML encontrados: $(find . -name '*.html' | wc -l)"

      - name: Validar sintaxe do HTML
        run: npx htmlhint "**/*.html"